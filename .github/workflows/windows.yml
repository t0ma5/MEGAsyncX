# Build MEGAsyncX on GitHub-hosted Windows. First run is slow (vcpkg).
# Kick: register this workflow with GitHub Actions.
name: Windows

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: write
  actions: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      VCPKG_MAX_CONCURRENCY: "4"
      CMAKE_BUILD_PARALLEL_LEVEL: "4"
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      QT_VERSION: "5.15.2"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Init MEGA SDK submodule
        run: git submodule update --init src/MEGASync/mega

      - name: Export GitHub Actions cache for vcpkg
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Qt 5.15.2 MSVC 2019 64-bit
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          cache: true
          archives: qtbase qtdeclarative qtquickcontrols qtquickcontrols2 qtsvg qttools qtgraphicaleffects qtimageformats qtwinextras qttranslations

      - name: Clone vcpkg at manifest baseline
        run: |
          git clone https://github.com/microsoft/vcpkg.git "${{ env.VCPKG_ROOT }}"
          git -C "${{ env.VCPKG_ROOT }}" checkout ef7dbf94b9198bc58f45951adcf1f041fcbc5ea0
          & "${{ env.VCPKG_ROOT }}\bootstrap-vcpkg.bat" -disableMetrics

      - name: Configure CMake
        run: |
          cmake -G "Visual Studio 17 2022" -A x64 -T v143 `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
            -DVCPKG_ROOT="$env:VCPKG_ROOT" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-mega `
            -DENABLE_EXPLORER_EXT=OFF `
            -DENABLE_DESKTOP_UPDATER=OFF `
            -DENABLE_DESKTOP_UPDATE_GEN=OFF `
            -DENABLE_DESKTOP_APP_TESTS=OFF `
            -DENABLE_DESIGN_TOKENS_IMPORTER=OFF `
            -DUSE_BREAKPAD=OFF `
            -DENABLE_DESKTOP_APP_WERROR=OFF `
            -S "${{ github.workspace }}" `
            -B "${{ github.workspace }}/build-x64"

      - name: Build MEGAsync
        run: |
          cmake --build "${{ github.workspace }}/build-x64" --config RelWithDebInfo --target MEGAsync -j 4

      - name: Deploy Qt next to exe
        shell: pwsh
        run: |
          $out = Join-Path "${{ github.workspace }}" "build-x64\src\MEGASync\RelWithDebInfo"
          $exe = Join-Path $out "MEGAsyncX.exe"
          if (-not (Test-Path $exe)) { throw "Missing $exe" }
          $deploy = Join-Path $env:QT_ROOT_DIR "bin\windeployqt.exe"
          & $deploy --release --compiler-runtime --qmldir "${{ github.workspace }}\src\MEGASync" $exe
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed" }

      - name: Upload MEGAsyncX
        uses: actions/upload-artifact@v4
        with:
          name: MEGAsyncX-windows-x64
          path: ${{ github.workspace }}/build-x64/src/MEGASync/RelWithDebInfo
          if-no-files-found: error
          retention-days: 14

      - name: Zip MEGAsyncX
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $out = Join-Path "${{ github.workspace }}" "build-x64\src\MEGASync\RelWithDebInfo"
          $zip = Join-Path "${{ github.workspace }}" "MEGAsyncX-6.6.2-windows-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip }
          Compress-Archive -Path (Join-Path $out '*') -DestinationPath $zip

      - name: Publish GitHub release
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $zip = Join-Path "${{ github.workspace }}" "MEGAsyncX-6.6.2-windows-x64.zip"
          $tag = "v6.6.2-$env:GITHUB_RUN_NUMBER"
          $sha = $env:GITHUB_SHA.Substring(0, 9)
          $notesPath = Join-Path $env:RUNNER_TEMP "release-notes.md"
          @"
          Windows x64 build of MEGAsyncX 6.6.2.

          Unzip the archive and run MEGAsyncX.exe. The build is unsigned, so SmartScreen warns on first launch. reported-version.txt is already next to the exe.

          Import places new accounts beside neighbors from the same file, so a slice of a master list keeps its order. The tray shows up to ten accounts from that saved list, with the active account in the middle. New accounts default to finished-transfer and info-message toasts. Accounts that already saved notification choices keep them.

          This build is commit $sha.
          "@ | Set-Content -Path $notesPath -Encoding utf8NoBOM
          gh release create $tag $zip --repo $env:GITHUB_REPOSITORY --title "MEGAsyncX 6.6.2 ($tag)" --latest --notes-file $notesPath
